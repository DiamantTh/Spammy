[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spammy"
dynamic = ["version"]
description = "Local spam analysis and multi-language abuse report generator"
authors = [
  { name = "Local Admin" }
]
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ipwhois>=1.2.0",
  "requests>=2.31",
  "jinja2>=3.1",
  "dnspython>=2.7",
]

[project.scripts]
spammy = "spammy.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "rich>=13.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "spammy.version.__version__"}

[tool.setuptools.package-data]
"spammy" = ["templates/*.j2", "_version.txt"]

[tool.setuptools.packages.find]
where = ["src"]
