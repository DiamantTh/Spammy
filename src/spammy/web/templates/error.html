{% extends "base.html" %}
{% block title %}Fehler {{ code or 500 }}{% endblock %}
{% block content %}
<div class="status-box status-box--error">
  <h1>Fehler {{ code or 500 }}</h1>
  <p>{{ message or 'Ein unbekannter Fehler ist aufgetreten.' }}</p>
  <a href="{{ url_for('ui.dashboard') }}" class="btn btn--primary">← Zurück zum Dashboard</a>
</div>
{% endblock %}
