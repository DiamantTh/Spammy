[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spammy"
dynamic = ["version"]
description = "Local spam analysis and multi-language abuse report generator"
authors = [
  { name = "Local Admin" }
]
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ipwhois>=1.3.0",
  "requests>=2.33",
  "jinja2>=3.1.6",
  "dnspython>=2.8",
  "itsdangerous>=2.2",
]

[project.scripts]
spammy = "spammy.cli:main"

[project.optional-dependencies]
web = [
  "quart>=0.20",
  "hypercorn>=0.17",
  "aiofiles>=24.1",
  "python-multipart>=0.0.20",
  "psutil>=6.0",
]
api = [
  "spammy[web]",
  "fastapi>=0.115",
  "pydantic>=2.10",
]
all = [
  "spammy[api]",
]
dev = [
  "pytest>=8.2",
  "rich>=13.7",
  "httpx>=0.27",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "spammy.version.__version__"}

[tool.setuptools.package-data]
"spammy" = [
  "templates/*.j2",
  "_version.txt",
  "web/templates/*.html",
  "web/static/css/*.css",
  "web/static/js/*.js",
]

[tool.setuptools.packages.find]
where = ["src"]
