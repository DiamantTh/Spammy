{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Dashboard</h1>
  <a href="{{ url_for('ui.analyze_form') }}" class="btn btn--primary">+ E-Mail analysieren</a>
</div>

<section class="section" id="active-jobs-section" style="display:none">
  <h2 class="section-heading">Laufende Analysen</h2>
  <div class="job-list" id="active-jobs-list"></div>
</section>

<section class="section">
  <h2 class="section-heading">Letzte Analysen</h2>
  <div class="table-wrap">
    <table class="data-table" id="history-table">
      <thead>
        <tr>
          <th>Betreff</th>
          <th>Absender</th>
          <th>Empfänger</th>
          <th>Kategorie</th>
          <th>Datum</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="history-tbody">
        <tr id="history-loading"><td colspan="6" class="text-center muted">Lade…</td></tr>
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
