# Spammy configuration example

[rdap]
base_url = "https://rdap.org"
timeout = 8

[reporting]
# Optional template directory relative to the project root
# template_dir = "templates/custom"

[storage]
backend = "sqlite"
# database = "var/data/spammy.sqlite3"
# driver = "postgresql"
# host = "localhost"
# port = 5432
# user = "spammy"
# password = "secret"
# database = "spammy"

# Alternative Beispiele:
# driver = "mysql"
# host = "db.internal"
# port = 3306
# user = "spammy"
# password = "secret"
# database = "spammy"

# Für Microsoft SQL Server via ODBC:
# driver = "mssql+pyodbc"
# odbc_dsn = "Driver=ODBC Driver 18 for SQL Server;Server=tcp:sql.example,1433;Encrypt=yes;TrustServerCertificate=yes;UID=spammy;PWD=secret"

[cache]
# url = "memcached://localhost:11211"

# ── Web UI (Quart) ──────────────────────────────────────────────────────────
# Starte den Web-Server mit: spammy serve
#
[web]
# Bind-Adresse und Port für die Web-Oberfläche.
# Für öffentliche Instanzen bitte hinter einem Reverse-Proxy (nginx/Caddy) betreiben.
host    = "127.0.0.1"
port    = 8080

# Muss ein langer, zufälliger String sein – niemals den Beispielwert verwenden!
# Generiere einen mit: python -c "import secrets; print(secrets.token_hex(32))"
secret_key = "please-change-this-secret"

# Öffentlich erreichbare Basis-URL (wird für CSRF-Prüfung und Redirects verwendet)
base_url = "http://localhost:8080"

# Nur für lokale Entwicklung! Niemals im Produktiveinsatz aktivieren.
debug = false

# ── Externe öffentliche API (FastAPI) ──────────────────────────────────────
# Aktiviere die externe API mit: spammy serve --with-api
# oder setze enabled = true in dieser Sektion.
#
[external_api]
enabled = false
host    = "127.0.0.1"
port    = 8081

# X-API-Key für den Zugriff auf die externe API.
# Leer = Authentifizierung deaktiviert (nur für loopback/LAN geeignet).
# Generiere einen mit: python -c "import secrets; print(secrets.token_hex(32))"
key = ""
